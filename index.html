<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memotest Musical</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="pantalla-inicio">
      <h1>🎵 Memotest Musical</h1>
      <p id="subtitulo">Encontrá los pares que suenan igual</p>
      <button id="btn-iniciar">Jugar</button>
    </div>

    <div id="pantalla-juego" class="oculto">
      <div id="info-juego">
        <span id="contador-pares">Pares: 0 / 6</span>
      </div>
      <div id="tablero"></div>
    </div>

    <div id="pantalla-victoria" class="oculto">
      <div id="mensaje-victoria">
        <h2>🎉 ¡Ganaste!</h2>
        <p>Encontraste todos los pares</p>
        <button id="btn-reiniciar">Jugar de nuevo</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
